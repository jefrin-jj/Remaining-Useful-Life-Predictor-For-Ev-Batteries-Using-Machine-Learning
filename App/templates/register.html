{% extends 'index.html' %}
{% block body %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EV Service Center - Register Vehicle</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>

<body>

  <br><br><br><br><br>

  <section id="register" class="py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card shadow">
            <div class="card-header bg-primary text-white">
              <h3 class="mb-0">Vehicle Registration Form</h3>
            </div>
            <div class="card-body">
              <form method="POST" action="{% url 'register' %}">
                {% csrf_token %}

                <!-- Owner Information -->
                <h4 class="mb-3">Owner Information</h4>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="ownerName" class="form-label">Owner Name*</label>
                    <input type="text" class="form-control" id="ownerName" name="ownerName" required>
                  </div>
                  <div class="col-md-6">
                    <label for="contactNumber" class="form-label">Contact Number*</label>
                    <input type="tel" class="form-control" id="contactNumber" name="contactNumber" required>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" name="email">
                  </div>
                  <div class="col-md-6">
                    <label for="address" class="form-label">Address*</label>
                    <input type="text" class="form-control" id="address" name="address" required>
                  </div>
                </div>

                <!-- Vehicle Info -->
                <h4 class="mb-3 mt-4">Vehicle Information</h4>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="vehicleNumber" class="form-label">Vehicle Number*</label>
                    <input type="text" class="form-control" id="vehicleNumber" name="vehicleNumber" required>
                  </div>
                  <div class="col-md-4">
                    <label for="make" class="form-label">Make*</label>
                    <input type="text" class="form-control" id="make" name="make" required>
                  </div>
                  <div class="col-md-4">
                    <label for="model" class="form-label">Model*</label>
                    <input type="text" class="form-control" id="model" name="model" required>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="year" class="form-label">Year*</label>
                    <input type="number" class="form-control" id="year" name="year" required>
                  </div>
                  <div class="col-md-4">
                    <label for="color" class="form-label">Color</label>
                    <input type="text" class="form-control" id="color" name="color">
                  </div>
                  <div class="col-md-4">
                    <label for="vin" class="form-label">VIN*</label>
                    <input type="text" class="form-control" id="vin" name="vin" required>
                  </div>
                </div>

                <!-- Battery & Tech Info -->
                <h4 class="mb-3 mt-4">Battery & Technical Info</h4>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="batteryCapacity" class="form-label">Battery Capacity*</label>
                    <input type="number" class="form-control" id="batteryCapacity" name="batteryCapacity" required>
                  </div>
                  <div class="col-md-4">
                    <label for="batteryType" class="form-label">Battery Type*</label>
                    <select class="form-select" id="batteryType" name="batteryType" required>
                      <option value="">Select Battery Type</option>
                      <option value="Lithium-ion">Lithium-ion</option>
                      <option value="LiFePO4">LiFePO4</option>
                      <option value="NMC">NMC</option>
                      <option value="NCA">NCA</option>
                      <option value="Solid-state">Solid-state</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label for="range" class="form-label">Range (km)*</label>
                    <input type="number" class="form-control" id="range" name="range" required>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="motorType" class="form-label">Motor Type*</label>
                    <select class="form-select" id="motorType" name="motorType" required>
                      <option value="">Select Motor Type</option>
                      <option value="PMSM">PMSM</option>
                      <option value="Induction">Induction</option>
                      <option value="BLDC">BLDC</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-md-4">
                    <label for="motorPower" class="form-label">Motor Power (kW)*</label>
                    <input type="number" class="form-control" id="motorPower" name="motorPower" required>
                  </div>
                  <div class="col-md-4">
                    <label for="chargingType" class="form-label">Charging Type*</label>
                    <select class="form-select" id="chargingType" name="chargingType" required>
                      <option value="">Select Charging Type</option>
                      <option value="AC">AC</option>
                      <option value="DC">DC</option>
                      <option value="Both">Both</option>
                    </select>
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="maxChargingRate" class="form-label">Max Charging Rate (kW)</label>
                    <input type="number" class="form-control" id="maxChargingRate" name="maxChargingRate">
                  </div>
                  <div class="col-md-4">
                    <label for="odometer" class="form-label">Odometer (km)*</label>
                    <input type="number" class="form-control" id="odometer" name="odometer" required>
                  </div>
                  <div class="col-md-4">
                    <label for="batteryHealth" class="form-label">Battery Health (%)</label>
                    <input type="number" class="form-control" id="batteryHealth" name="batteryHealth" min="0" max="100">
                  </div>
                </div>
                <div class="row mb-3">
                  <div class="col-md-4">
                    <label for="lastServiceDate" class="form-label">Last Service Date</label>
                    <input type="date" class="form-control" id="lastServiceDate" name="lastServiceDate">
                  </div>
                  <div class="col-md-4">
                    <label for="softwareVersion" class="form-label">Software Version</label>
                    <input type="text" class="form-control" id="softwareVersion" name="softwareVersion">
                  </div>
                  <div class="col-md-4">
                    <label for="purchaseDate" class="form-label">Purchase Date*</label>
                    <input type="date" class="form-control" id="purchaseDate" name="purchaseDate" required>
                  </div>
                </div>

                <!-- Notes -->
                <div class="mb-3 mt-4">
                  <label for="notes" class="form-label">Additional Notes</label>
                  <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                </div>

                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                  <button type="reset" class="btn btn-outline-secondary me-md-2">Reset Form</button>
                  <button type="submit" class="btn btn-primary">Register Vehicle</button>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
{% endblock %}
