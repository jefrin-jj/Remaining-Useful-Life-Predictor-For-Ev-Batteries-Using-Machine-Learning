{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Battery Life Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Optional Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #ebedf3;
            padding-top: 100px;
        }
        .container-form {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 550px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            padding: 10px 20px;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        button:hover {
            background: #0b5ed7;
        }
        .result {
            margin-top: 20px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home' %}">
            <i class="bi bi-battery-charging me-2"></i>EV Service Center
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'vehicles' %}">Vehicles</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Register</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Battery Life Prediction Form -->
<div class="container-form mt-4">
    <h2 class="text-center mb-4">Battery Life Prediction</h2>
    <form method="post">
        {% csrf_token %}

        <label>Cycle Index:</label>
        <input type="number" step="any" name="cycle_index" required>

        <label>Discharge Time (s):</label>
        <input type="number" step="any" name="discharge_time" required>

        <label>Decrement 3.6-3.4V (s):</label>
        <input type="number" step="any" name="decrement" required>

        <label>Max. Voltage Dischar. (V):</label>
        <input type="number" step="any" name="max_voltage_dischar" required>

        <label>Min. Voltage Charg. (V):</label>
        <input type="number" step="any" name="min_voltage_charg" required>

        <label>Time at 4.15V (s):</label>
        <input type="number" step="any" name="time_415v" required>

        <label>Time Constant Current (s):</label>
        <input type="number" step="any" name="time_constant_current" required>

        <label>Charging Time (s):</label>
        <input type="number" step="any" name="charging_time" required>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <div class="result">{{ result }}</div>
    {% endif %}
</div>

</body>
</html>
